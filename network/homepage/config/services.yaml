# Auto-discovered services (Docker labels on the Pi + NAS socket-proxy)
# populate alongside these manual entries. Manual entries are for things that
# aren't Docker containers we control: network gear, Proxmox guests, NAS
# catalogue apps whose chart has no "Extra Labels" field.
#
# Hostnames must match a `@name host <fqdn>` matcher in
# network/caddy/Caddyfile — the wildcard cert resolves every *.mati-lab.online
# name, so a typo'd host reaches Caddy and 404s instead of failing DNS.

- Network:
    - Pi LAN gateway:
        href: http://192.168.1.1
        description: UniFi UDR — router, DHCP, firewall
        icon: mdi-router-network
    - TrueNAS UI:
        href: https://nas.mati-lab.online
        siteMonitor: https://nas.mati-lab.online
        description: NAS web admin (192.168.1.65)
        icon: truenas.png
    - Homebridge UI:
        href: https://homebridge.mati-lab.online
        siteMonitor: https://homebridge.mati-lab.online
        description: HomeKit bridge (192.168.1.155)
        icon: homebridge.png
        widget:
          type: homebridge
          url: http://192.168.1.155:8581
          username: '{{HOMEPAGE_VAR_HOMEBRIDGE_USERNAME}}'
          password: '{{HOMEPAGE_VAR_HOMEBRIDGE_PASSWORD}}'

# Proxmox host + its guests. proxmoxNode/proxmoxVMID/proxmoxType render live
# status + CPU/RAM straight from the PVE API — see config/proxmox.yaml.
# VMIDs come from `pvesh get /cluster/resources --type vm`.
- Proxmox:
    - Proxmox UI:
        href: https://proxmox.mati-lab.online
        siteMonitor: https://proxmox.mati-lab.online
        description: PVE manager (192.168.1.184)
        icon: proxmox.png
        widget:
          type: proxmox
          url: https://192.168.1.184:8006
          username: '{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}'
          password: '{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}'
          node: proxmox
    - Ollama GPU:
        href: http://192.168.1.48:11434
        description: VM 101 — Ollama, LiteLLM backend
        icon: ollama.png
        proxmoxNode: proxmox
        proxmoxVMID: 101
        proxmoxType: qemu
    - Gitea runner:
        href: https://gitea.mati-lab.online/gooral/mati-lab/actions
        description: VM 102 — Gitea Actions CI
        icon: gitea.png
        proxmoxNode: proxmox
        proxmoxVMID: 102
        proxmoxType: qemu
    - smart-resume:
        href: https://smart-resume.mati-lab.online
        siteMonitor: https://smart-resume.mati-lab.online
        description: LXC 110 — resume tailoring app
        icon: mdi-file-account
        proxmoxNode: proxmox
        proxmoxVMID: 110
        proxmoxType: lxc
    - restorate:
        href: https://restorate.mati-lab.online
        siteMonitor: https://restorate.mati-lab.online
        description: LXC 111 — restaurant rating app
        icon: mdi-silverware-fork-knife
        proxmoxNode: proxmox
        proxmoxVMID: 111
        proxmoxType: lxc

