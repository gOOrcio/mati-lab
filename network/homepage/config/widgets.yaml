# Header strip. ONLY info widgets belong here — homepage 2.2 accepts
# datetime, glances, greeting, kubernetes, logo, longhorn, openmeteo,
# openweathermap, resources, search, stocks, unifi_console, weather.
# Anything else renders as "Missing<type>" in the header. Per-service
# integrations (proxmox, homebridge, uptimekuma, …) are SERVICE widgets and
# live on a service entry in services.yaml or a homepage.widget.* Docker
# label — not here.

- resources:
    label: Pi
    cpu: true
    memory: true
    cputemp: true
    uptime: true

# Warsaw. openmeteo needs no API key; `cache` is in minutes.
- openmeteo:
    label: Warsaw
    latitude: 52.2297
    longitude: 21.0122
    timezone: Europe/Warsaw
    units: metric
    cache: 5

- search:
    provider: duckduckgo
    target: _blank

- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: short
