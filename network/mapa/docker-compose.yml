# Wysowa map (mapa.mati-lab.online): nginx over a read-only sparse checkout of
# gooral/wysowa + a dedicated Cloudflare Tunnel whose only ingress is mapa:80.
# Access (email OTP allow-list) sits in front at Cloudflare. See notes.md.
networks:
  # nginx lives only here — no route out, no host port on the LAN.
  mapa-internal:
    internal: true
  # cloudflared's egress to Cloudflare's edge.
  mapa-egress: {}

services:
  mapa:
    image: nginx:1.29-alpine
    container_name: mapa
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [mapa-internal]
    volumes:
      - /opt/wysowa/mapa:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      - "homepage.group=Network"
      - "homepage.name=Mapa Wysowa"
      - "homepage.icon=mdi-map"
      - "homepage.description=Private map via Cloudflare Tunnel + Access"

  mapa-tunnel:
    image: cloudflare/cloudflared:2026.7.3
    container_name: mapa-tunnel
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [mapa-internal, mapa-egress]
    environment:
      - TUNNEL_TOKEN=${MAPA_TUNNEL_TOKEN:-}  # from network/mapa/.env (gitignored)
    depends_on:
      mapa:
        condition: service_healthy
