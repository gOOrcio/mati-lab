# Family site "Działka 459" from gooral/wysowa (public/ only), served only
# through the dedicated "mapa" Cloudflare Tunnel with Access in front.
# The docroot is a sparse checkout containing nothing but public/ — the
# repo's other dirs (raw land-register extracts with PESELs, bank data)
# never reach the Pi's disk.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    autoindex off;
    charset utf-8;
    charset_types text/html text/plain text/markdown text/css application/javascript application/json;

    gzip on;
    gzip_types text/markdown application/json image/svg+xml text/css application/javascript;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # OSM tiles require a Referer (origin only)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /healthz    { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ /\.         { return 404; }                        # dotfiles, just in case
    location ~* \.md$      { types { } default_type text/markdown; try_files $uri =404; }  # read by doc.html
    location = /api/stan   { proxy_pass http://mapa-stan:8080; client_max_body_size 1k; }  # shared plan.html checkboxes (stan.py)
    location /             { try_files $uri $uri/index.html =404; }  # no dir listings, no 403 hints
}
