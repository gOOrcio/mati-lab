# Static map from gooral/wysowa, served only through the dedicated "mapa"
# Cloudflare Tunnel (Access in front). The docroot is a sparse checkout that
# contains nothing but mapa.html + podklady/ — the whitelist below is the
# second layer, not the only one.
server {
    listen 80;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;      # "/" -> "/mapa.html", not "http://mapa:80/mapa.html"
    autoindex off;

    gzip on;
    gzip_types application/json image/svg+xml text/css application/javascript;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # OSM tiles require a Referer (origin only)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    location = /        { return 302 /mapa.html; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /mapa.html  { try_files $uri =404; }
    location ^~ /podklady/ { try_files $uri =404; }
    location = /healthz    { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }  # dane/, cache/, build.py, deploy/ … never served
}
