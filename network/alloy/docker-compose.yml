networks:
  pihole-net:
    external: true

volumes:
  alloy-data: {}

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:edge
    container_name: docker-socket-proxy
    restart: always
    security_opt: [no-new-privileges:true]
    networks: [pihole-net]
    environment:
      CONTAINERS: 1
      IMAGES: 0
      NETWORKS: 1
      VOLUMES: 0
      INFO: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.docker.compose.project=alloy"
      - "com.docker.compose.service=docker-socket-proxy"

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: always
    security_opt: [no-new-privileges:true]
    networks: [pihole-net]
    depends_on:
      - docker-socket-proxy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      # UniFi UDR remote syslog -> alloy (RFC3164/UDP).
      # ufw restricts the source to 192.168.1.1 (the gateway) only.
      - "1514:1514/udp"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    labels:
      - "com.docker.compose.project=alloy"
      - "com.docker.compose.service=alloy"
      - "homepage.group=Observability"
      - "homepage.name=Alloy (Pi)"
      - "homepage.icon=mdi-script-text-outline"
      - "homepage.description=Pi log shipper → Loki"
