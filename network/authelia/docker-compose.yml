networks:
  pihole-net:
    external: true

services:
  redis:
    image: redis:7.2-alpine
    container_name: authelia-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${AUTHELIA_SESSION_REDIS_PASSWORD}"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks:
      - pihole-net
    labels:
      - "com.docker.compose.project=authelia"
      - "com.docker.compose.service=redis"

  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    env_file:
      - .env
    volumes:
      - ./configuration.yml:/config/configuration.yml
      - ./data:/config/data
    ports:
      - 9091:9091
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      - redis
    networks:
      - pihole-net
    labels:
      - "com.docker.compose.project=authelia"
      - "com.docker.compose.service=authelia"
      - "homepage.group=Network"
      - "homepage.name=Authelia"
      - "homepage.icon=authelia.png"
      - "homepage.href=https://authelia.mati-lab.online"
      - "homepage.description=Forward-auth (2FA SSO)"
      # gethomepage has no native "authelia" widget (only authentik) — a
      # widget.type it doesn't know renders as "Missing Widget Type" on the
      # card. customapi against Authelia's unauthenticated /api/health gives
      # the same signal with no credential.
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://authelia:9091/api/health"
      - "homepage.widget.refreshInterval=30000"
      # Docker label values reach Homepage as plain strings (only env-var
      # substitution runs on them), so a JSON array here arrives as a string
      # and the widget throws. Homepage's shvl splits the label key on
      # [.[]] and builds an array when the next segment is numeric, so
      # nested/array config has to be spelled out index by index.
      - "homepage.widget.mappings[0].field=status"
      - "homepage.widget.mappings[0].label=Health"
