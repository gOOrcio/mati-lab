# Phase 8 — Alertmanager routing.
# Single ntfy receiver via webhook (ntfy supports POST with title +
# priority via custom headers; we route through HTTP basic-style with the
# topic in the URL path).
#
# When more receivers / silences / inhibitions accumulate, split rules by
# severity into separate routes. Today there's one severity (warning/critical)
# and one channel (ntfy/homelab-alerts).

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'host', 'pool']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  receiver: ntfy
  routes:
    # Watchdog is the dead-man heartbeat (always firing, consumed via the
    # Alertmanager API by network/deadman/alerting-deadman.sh). Never notify.
    - matchers: [alertname="Watchdog"]
      receiver: 'null'

receivers:
  - name: 'null'
  - name: ntfy
    webhook_configs:
      - url: 'http://ntfy:80/homelab-alerts'
        send_resolved: true
        http_config:
          # ntfy runs auth-default-access:deny — anonymous publishes get 403.
          # Token minted for the dedicated write-only `alertmanager` ntfy user;
          # rotation row in nas/secrets-inventory.md (ntfy section).
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/ntfy-token

inhibit_rules:
  # If a pool is critical-full, suppress the warning-full alert for the same pool.
  - source_matchers: [severity="critical", alertname="ZFSPoolCritical"]
    target_matchers: [severity="warning", alertname="ZFSPoolNearFull"]
    equal: [pool, host]
