server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 10s
    relabel_configs:
      # Use container name as the primary label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Add compose project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      # Add compose service label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      # Add host label
      - target_label: 'host'
        replacement: 'network-pi'
      # Drop promtail and socket proxy logs to avoid recursion
      - source_labels: ['__meta_docker_container_name']
        regex: '/(promtail|docker-socket-proxy)'
        action: drop

  # ── UniFi UDR syslog ──────────────────────────────────────────────────────
  # Added 2026-09-10. The UDR's own log view is short-lived and, critically,
  # not queryable: stat/event, stat/alarm and stat/ips/event all reject
  # Integration API keys, so firewall denials could only be read by hand in the
  # UI. Shipping them here makes them searchable, correlatable with Pi/NAS logs,
  # retained 30 days, and alertable.
  #
  # UniFi sends RFC3164 (BSD), not RFC5424 — promtail defaults to the latter and
  # silently drops what it cannot parse, so syslog_format is mandatory here.
  # Security events arrive as CEF inside the message body.
  - job_name: unifi-syslog
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: udp
      syslog_format: rfc3164
      idle_timeout: 60s
      label_structured_data: false
      labels:
        job: unifi
        host: udr
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: 'unifi_host'
      - source_labels: ['__syslog_message_severity']
        target_label: 'severity'
    pipeline_stages:
      # UniFi firewall events arrive in the kernel's iptables LOG format, NOT
      # CEF. This was originally written against CEF and silently matched
      # nothing — every label came back empty. Verified against the live
      # stream before rewriting: 0 lines contained "CEF:", 240/240 firewall
      # lines matched the shape below. Sample:
      #
      #   Dream-Router [CUSTOM2_LAN-D-10001] DESCR="IoT-to-Infra-deny"
      #   IN=br30 OUT=br0 MAC=... SRC=192.168.30.221 DST=192.168.1.126
      #   ... PROTO=UDP SPT=1900 DPT=64472 ...
      #
      # NOTE: Go uses RE2 — no lookahead/lookbehind. Field names are
      # UPPERCASE here (SRC/DST/DPT), unlike CEF's lowercase src/dst/dpt.
      - match:
          selector: '{job="unifi"} |= "DESCR="'
          stages:
            # [CUSTOM2_LAN-D-10001] -> ruleset / verdict (D=drop, A=accept) / index
            - regex:
                expression: '\[(?P<ruleset>[A-Za-z0-9_]+)-(?P<verdict>[A-Za-z])-(?P<rule_index>\d+)\]'
            - regex:
                expression: 'DESCR="(?P<policy>[^"]*)"'
            - regex:
                expression: '\bSRC=(?P<src>\S+)'
            - regex:
                expression: '\bDST=(?P<dst>\S+)'
            - regex:
                expression: '\bPROTO=(?P<proto>\S+)'
            - regex:
                expression: '\bSPT=(?P<sport>\d+)'
            - regex:
                expression: '\bDPT=(?P<dport>\d+)'
            # Only low-cardinality fields become labels. src / dst / sport /
            # dport stay as extracted fields for line filtering — a label per
            # IP or port would blow up the index.
            - labels:
                policy:
                proto:
                verdict:
