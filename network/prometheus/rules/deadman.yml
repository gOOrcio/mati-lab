# Dead-man switch plumbing (2026-09-06, after the 3-month silent alerting
# outage — see docs/sweep-2026-09-06.md).
#
# Watchdog fires ALWAYS. It is routed to the `null` receiver in
# alertmanager.yml (never notifies); its only consumer is
# network/deadman/alerting-deadman.sh, which asserts its presence in
# Alertmanager's active-alerts API. Watchdog missing there = the
# Prometheus→Alertmanager chain is broken.
groups:
  - name: deadman
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Always-firing heartbeat for the alerting dead-man check"

      # Catches PARTIAL egress breakage while delivery still works for this
      # alert itself (e.g. one receiver failing). Full egress death is the
      # dead-man script's job (this alert couldn't deliver then).
      - alert: AlertmanagerNotifyFailing
        expr: increase(alertmanager_notifications_failed_total[1h]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager notification attempts are failing"
          description: "alertmanager_notifications_failed_total increased over the last hour — check `docker logs alertmanager` on the Pi for the receiver error (last time this happened it was a 403 from ntfy)."
