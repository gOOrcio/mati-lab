networks:
  pihole-net:
    external: true

volumes:
  grafana-storage: {}

services:
  grafana:
    image: grafana/grafana:12.2.5
    container_name: grafana
    restart: always
    security_opt: [no-new-privileges:true]
    env_file:
      - .env
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    networks:
      - pihole-net
    labels:
      - "com.docker.compose.project=grafana"
      - "com.docker.compose.service=grafana"
      - "homepage.group=Observability"
      - "homepage.name=Grafana"
      - "homepage.icon=grafana.png"
      - "homepage.href=https://grafana.mati-lab.online"
      - "homepage.description=Dashboards"
      - "homepage.siteMonitor=https://grafana.mati-lab.online"
      # No homepage widget: gethomepage's grafana widget calls
      # /api/admin/stats, which needs a Grafana *server* admin (org Admin is
      # not enough — gooral@authelia is org Admin and still gets 403), and the
      # widget renders an API error if that one call fails. Not worth putting
      # the server-admin password on a dashboard card.
