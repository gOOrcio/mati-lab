# Network Pi configuration
pi_hostname: network
pi_user: gooral
pi_timezone: Europe/Warsaw

# Static network (see templates/netplan-ethernet.yaml.j2 for rationale)
pi_ip: "192.168.1.252"
pi_netmask_bits: 24
pi_gateway: "192.168.1.1"
# Self first (Pi-hole on this host), then a public fallback so the Pi can
# still resolve if Pi-hole's container is down during boot/maintenance.
pi_nameservers: ["192.168.1.252", "1.1.1.3"]
pi_dns_search: "mati-lab.online"

# Power & boot resilience (Pi 4/5 EEPROM + kernel watchdog)
# POWER_OFF_ON_HALT=0 makes sure `shutdown -h` doesn't trap the Pi in a
# low-power state that ignores AC-restore — the Pi will boot whenever power
# is applied. BOOT_ORDER 0xf416 = NVMe → USB-MSD → SD → restart, so a flaky
# NVMe falls back instead of stalling the bootloader. PSU_MAX_CURRENT=5000
# silences the under-voltage check on the 27W USB-C PD supply (Pi 5).
rpi_power_off_on_halt: 0
rpi_boot_order: "0xf416"
rpi_psu_max_current: 5000

# systemd hardware watchdog (bcm2835_wdt). If userspace hangs (e.g. NVMe
# I/O stall) systemd stops pinging /dev/watchdog and the SoC self-reboots
# after RuntimeWatchdogSec. RebootWatchdogSec catches a wedged shutdown
# (e.g. fsck waiting on input) and forces a reboot instead of staying down.
systemd_runtime_watchdog_sec: "30s"
systemd_reboot_watchdog_sec: "2min"

# Ignore short KEY_POWER events from the Pi 5 PMIC. Spurious power-key
# events from brownouts caused 2026-05-22 outage (see notes.md). A long
# press (handled in PMIC hardware) still cuts power, so this only
# disables the *software* honoring of the short-press event.
logind_handle_power_key: ignore
logind_handle_power_key_long_press: poweroff

# Docker
docker_registry_mirror: "http://192.168.1.252:5000"
docker_log_max_size: "10m"
docker_log_max_file: "3"
docker_data_root: "/mnt/nvme/docker"

# UFW firewall rules
ufw_default_incoming: deny
ufw_default_outgoing: allow
ufw_rules:
  - { rule: allow, port: "22", proto: tcp, from: "192.168.1.0/24", comment: "SSH LAN" }
  - { rule: allow, port: "22", proto: tcp, from: "10.0.0.0/24", comment: "SSH VPN" }
  - { rule: allow, port: "80", proto: tcp, comment: "HTTP" }
  - { rule: allow, port: "443", proto: tcp, comment: "HTTPS" }
  - { rule: allow, port: "443", proto: udp, comment: "HTTPS QUIC" }
  - { rule: allow, port: "53", proto: tcp, from: "192.168.1.0/24", comment: "DNS TCP LAN" }
  - { rule: allow, port: "53", proto: udp, from: "192.168.1.0/24", comment: "DNS UDP LAN" }
  - { rule: allow, port: "53", proto: tcp, from: "172.18.0.0/16", comment: "DNS TCP Docker" }
  - { rule: allow, port: "53", proto: udp, from: "172.18.0.0/16", comment: "DNS UDP Docker" }
  - { rule: allow, port: "5000", proto: tcp, from: "192.168.1.0/24", comment: "Docker registry mirror LAN" }
  - { rule: allow, port: "5001", proto: tcp, from: "192.168.1.0/24", comment: "Docker private registry LAN" }

# fail2ban
fail2ban_maxretry: 5
fail2ban_bantime: 3600
fail2ban_findtime: 600

# SSH hardening
ssh_permit_root_login: "prohibit-password"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_max_auth_tries: 3

# NAS (TrueNAS Scale)
nas_ip: "192.168.1.65"
nas_backup_share: "/mnt/bulk/backups"
nas_mount_point: "/mnt/nas/backups"

# Backup schedule
backup_time: "02:00:00"
backup_keep_days: 30

# Docker data drive. Mount point kept as /mnt/nvme for continuity (daemon.json
# data-root + cadvisor bind reference it), but as of 2026-06-07 this is a USB
# SATA SSD (Samsung 870 EVO), NOT the M.2 NVMe — the Argon NEO 5 M.2 carrier /
# PCIe path failed (killed POST with *any* drive attached; two drives reproduced
# it). See notes.md "Postmortem — 2026-06-06". USB bridge passes TRIM.
nvme_uuid: "8e6eed31-52db-4707-a8bf-a1b574399c1a"
nvme_mount_point: "/mnt/nvme"
