# act_runner config — canonical copy for the MacBook runner.
# Live file: ~/.config/act_runner/config.yaml on the Mac.
# Generated via `act_runner generate-config`, trimmed to the fields we set;
# unlisted fields ride on defaults. NO secrets in this file (the runner
# credential lives in ~/.config/act_runner/.runner — never committed).

log:
  level: info

runner:
  # one job at a time — this is a laptop, not a build farm
  capacity: 1
  timeout: 3h
  # labels are set at registration; kept here for reference
  labels:
    - "macos-arm64:host"
    - "linux-arm64:docker://ghcr.io/catthehacker/ubuntu:act-latest"

cache:
  enabled: true

container:
  # Socket is set explicitly: launchd does not see the docker CLI context, and
  # Docker Desktop's /var/run/docker.sock symlink only exists once its
  # privileged helper is installed. Docker Desktop's own socket is stable.
  # (colima would be unix:///Users/<user>/.colima/default/docker.sock)
  docker_host: "unix:///Users/mateuszgoral/.docker/run/docker.sock"
  network: bridge

host:
  # absolute path — the runner does not expand `~`
  workdir_parent: /Users/mateuszgoral/.cache/act_runner
