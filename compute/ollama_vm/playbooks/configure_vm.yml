- name: Configure VM
  hosts: ollama-gpu
  become: true
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml
  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    # Passwordless sudo for the Ansible user so future `make deploy` /
    # `make configure` runs are fire-and-forget. First-time provision still
    # needs `-K` (prompt for sudo password) until this file is written; once
    # it exists, Ansible `become` works without a password.
    - name: Allow passwordless sudo for Ansible user
      ansible.builtin.copy:
        content: "{{ vm_ssh_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ vm_ssh_user }}"
        mode: "0440"
        owner: root
        group: root
        validate: "visudo -cf %s"

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - fail2ban
          - linux-headers-generic
        state: present

    - name: Install Nvidia open driver
      ansible.builtin.apt:
        name: "{{ nvidia_driver_package }}"
        state: present

    # Driver installation triggers a kernel module build — reboot required after this task
    # if running for the first time. The play continues; reboot manually if nvidia-smi fails.
    # 192.168.1.0/24 = VLAN 1 (NAS/LiteLLM, Pi, Proxmox). 192.168.20.0/24 =
    # Trusted VLAN 20 (dev PC, laptops) since the 2026-09-07 segmentation —
    # without it the dev PC can ping the VM but every TCP connection times out.
    - name: Configure UFW — allow SSH from LAN + Trusted VLAN
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ ufw_allowed_sources }}"

    - name: Configure UFW — allow Ollama from LAN + Trusted VLAN
      community.general.ufw:
        rule: allow
        port: "11434"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ ufw_allowed_sources }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started
