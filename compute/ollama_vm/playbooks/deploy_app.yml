- name: Deploy Ollama
  hosts: ollama-gpu
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml

  tasks:
    - name: Create ollama group
      ansible.builtin.group:
        name: ollama
        system: true
        state: present
      become: true

    - name: Create ollama user
      ansible.builtin.user:
        name: ollama
        group: ollama
        system: true
        shell: /bin/false
        home: /usr/share/ollama
        create_home: true
        state: present
      become: true

    - name: Check current Ollama version
      ansible.builtin.command: /usr/local/bin/ollama --version
      register: ollama_current_version
      failed_when: false
      changed_when: false

    # Since v0.14 the only Linux asset is a .tar.zst holding bin/ollama plus
    # lib/ollama (CUDA runners). Extract into /usr/local like the official
    # install.sh. Rollback = set ollama_version back and re-run (no local copy:
    # the VM disk is 62G and lib/ollama alone is ~4G).
    - name: Install zstd
      ansible.builtin.apt:
        name: zstd
        state: present
      become: true

    - name: Upgrade Ollama release
      when: ollama_version not in ((ollama_current_version.stdout | default('')) ~ (ollama_current_version.stderr | default('')))
      become: true
      block:
        - name: Download Ollama release archive
          ansible.builtin.get_url:
            url: "https://github.com/ollama/ollama/releases/download/v{{ ollama_version }}/ollama-linux-amd64.tar.zst"
            dest: "/tmp/ollama-{{ ollama_version }}.tar.zst"
            mode: "0644"

        - name: Stop Ollama
          ansible.builtin.systemd:
            name: ollama
            state: stopped
          failed_when: false

        # lib/ollama's runner layout changes between releases; stale runners
        # would be picked up alongside the new ones.
        - name: Remove old Ollama libs
          ansible.builtin.file:
            path: /usr/local/lib/ollama
            state: absent

        - name: Extract Ollama release into /usr/local
          ansible.builtin.shell: |
            set -o pipefail
            zstd -dc /tmp/ollama-{{ ollama_version }}.tar.zst | tar -x -C /usr/local
          args:
            executable: /bin/bash
          changed_when: true
          notify: Restart Ollama

        - name: Remove downloaded Ollama archive
          ansible.builtin.file:
            path: "/tmp/ollama-{{ ollama_version }}.tar.zst"
            state: absent

    - name: Install Ollama systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama.service
        content: |
          [Unit]
          Description=Ollama Service
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/ollama serve
          User=ollama
          Group=ollama
          Restart=always
          RestartSec=3
          Environment="PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          Environment="OLLAMA_HOST={{ ollama_host }}"

          [Install]
          WantedBy=default.target
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: Restart Ollama

    - name: Enable and start Ollama
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
        daemon_reload: true
      become: true

    - name: Wait for Ollama to be ready
      ansible.builtin.uri:
        url: "http://{{ vm_ip }}:11434"
        method: GET
        status_code: 200
      register: ollama_status
      until: ollama_status.status == 200
      retries: 10
      delay: 5
      delegate_to: localhost

    - name: Pull Ollama models
      ansible.builtin.command:
        cmd: "ollama pull {{ item }}"
      loop: "{{ ollama_models }}"
      # ollama pull is a plain HTTP call to the local server — no root,
      # no become_user needed. Override the play-level `become: true`.
      become: false
      environment:
        OLLAMA_HOST: "http://127.0.0.1:11434"
      changed_when: true
      # Previously `delegate_to: localhost` + `become_user: ollama`: tried
      # to run `ollama pull` on the Ansible control host as a local user
      # that doesn't exist. Runs on the VM directly now, as the SSH user.
      # Note: large models (qwen3.5:9b = 6.6GB) can take several minutes each

  handlers:
    - name: Restart Ollama
      ansible.builtin.systemd:
        name: ollama
        state: restarted
        daemon_reload: true
      become: true
