all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ lookup('env', 'HOME') }}/.local/share/mise/installs/python/3.13.5/bin/python3"
    proxmox:
      ansible_host: "192.168.1.184"
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_python_interpreter: /usr/bin/python3
      # Wake-on-LAN: primary NIC name on the Proxmox host. The `wol` playbook
      # enables magic-packet wake on it; the wake helper uses its MAC.
      # Override per-host if the NIC name differs.
      wol_interface: eno1
    ollama-gpu:
      ansible_host: "192.168.1.48"
      ansible_user: ollama-gpu
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_python_interpreter: /usr/bin/python3
