# Proxmox connection (reuse Ollama VM's vault — same Proxmox)
proxmox_host: "192.168.1.184"
proxmox_node: "proxmox"
proxmox_api_user: "root@pam"
proxmox_api_token_id:     "{{ vault_proxmox_api_token_id }}"
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret }}"

# VM spec
vm_id: 102
vm_name: "gitea-runner"
# debian12-cloud (only generic cloud-init template available;
# ollama_vm cloned from a GPU-passthrough variant we don't want here)
vm_template_id: 9000
vm_cores: 2
vm_memory_mb: 3072    # no balloon — DinD hates memory squeeze mid-build
vm_disk_size: "64G"
vm_storage: "local-lvm"

# Network (static)
vm_ip: "192.168.1.49"
vm_gateway: "192.168.1.1"
vm_nameserver: "192.168.1.1"
vm_cidr: 24

# SSH
vm_ssh_user: "gitea-runner"
vm_ssh_key_path: "~/.ssh/id_ed25519.pub"

# gitea-runner (formerly act_runner — renamed at 1.0.0: binary gitea-runner,
# metrics gitea_runner_*). Config YAML keys, GITEA_* env vars, labels and the
# .runner registration file are unchanged, so 0.6.1 → 5.2.4 was a tag swap.
# Behaviour changes that matter here: 3.2 stopped sharing RUNNER_TOOL_CACHE
# (tool_cache_mode: none — `shared` corrupts with capacity 2, so setup-*
# re-download per job); 4.0 says bridge jobs can't reach a cache server
# outside bridge — under DinD the runner is the inner host so it should hold;
# not exercised yet (only setup-go caches, and its one caller has no go.sum).
# 5.2.4 = act_runner on go1.27.3 (CVE-2026-111943); its inner dind dockerd is
# docker 29.9.1 (go1.26.9) until upstream rebuilds on 29.9.2.
gitea_runner_version: "5.2.4"   # pin; bump intentionally
gitea_instance_url: "https://gitea.mati-lab.online"

# Pull-through Docker Hub cache served from the Pi (network/registry-mirror/).
# Wired into the inner rootless dockerd via /home/rootless/.config/docker/daemon.json.
registry_mirror_host: "192.168.1.252"
registry_mirror_port: 5000
