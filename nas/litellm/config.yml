# LiteLLM gateway config for the Phase 3 LLM stack.
#
# IPs:
#   192.168.1.48  = Proxmox Ollama VM (ollama-gpu) — always-on
#   192.168.1.173 = Dev PC (Ubuntu-side only) — health-flaps by design
#
# Aliases consumed by clients:
#   agent-default : Hermes daily driver. DeepSeek > Claude > local Qwen 14B.
#   agent-smart   : Hermes explicit escalation. Claude Sonnet 4.6 only.
#   coding        : OpenCode or ad-hoc code. Dev PC > DeepSeek > Proxmox.
#   embeddings    : Phase 6 RAG consumer. Always Proxmox nomic-embed.
#   claude-*      : Claude Code gateway (token-efficiency campaign #1). API-key
#                   tier + prompt-cache injection. Subscription-OAuth forwarding
#                   + hybrid fallback land in campaign #2 (needs the CC client
#                   to validate the override/health-check behaviour). See
#                   nas/litellm/notes.md.

model_list:
  # ── agent-default (Hermes session driver) ──
  - model_name: agent-default
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      order: 1

  - model_name: agent-default           # fallback 1: Claude if DeepSeek 5xx
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points:   # cache Hermes's stable system prefix (#7)
        - location: message
          role: system
    model_info:
      order: 2

  - model_name: agent-default           # fallback 2: dev-PC local — gpt-oss:20b,
    litellm_params:                      # best-fit for the 5070 Ti (100% GPU, ~12GB)
      model: ollama_chat/gpt-oss:20b
      api_base: http://192.168.1.173:11434
    model_info:
      order: 3
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ── agent-smart (explicit /smart or delegated subagents) ──
  - model_name: agent-smart
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points:   # cache the stable system prefix (#7)
        - location: message
          role: system

  # ── coding (OpenCode primary, code-specific model) ──
  # dev-PC tier is gpt-oss:20b (best-fit local for the 5070 Ti — 100% GPU,
  # ~12GB, reasoning+agentic+coding). qwen2.5-coder:14b stays installed as a
  # non-reasoning alternative but is no longer the primary tier.
  - model_name: coding
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://192.168.1.173:11434
    model_info:
      order: 1
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: coding                  # fallback 1: DeepSeek if dev PC off
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      order: 2

  - model_name: coding                  # fallback 2: Proxmox local — qwen3.5:9b,
    litellm_params:                      # best-fit for the 3070 (8GB, ~6.6GB, 48 tok/s)
      model: ollama_chat/qwen3.5:9b
      api_base: http://192.168.1.48:11434
    model_info:
      order: 3
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ── embeddings (Phase 6 RAG consumer) ──
  # Locked at nomic-embed-text after the 2026-04-30 bake-off:
  # all three candidates (nomic 768d, mxbai 1024d, bge-m3 1024d) hit
  # recall@5=1.00 on a 5-query corpus; nomic was lowest-latency (39ms
  # median vs 43/157ms). 768d also halves Qdrant storage cost. The
  # obsidian-vault collection's vector_size is locked at 768 to match.
  - model_name: embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://192.168.1.48:11434

  # ── Claude Code gateway (token-efficiency campaign #1) ──
  # API-key tier for the models Claude Code's /model picker will show once it
  # points ANTHROPIC_BASE_URL here (campaign #2). cache_control_injection_points
  # keeps CC's large, stable system prompt cached at ~10% read cost even when
  # the client doesn't set the breakpoint itself — the token-efficiency win.
  # Subscription-OAuth forwarding (subscription-primary, API fallback) is added
  # in campaign #2, where the real CC client can validate that a forwarded OAuth
  # overrides the deployment key and that health-checks don't mis-route.
  # claude-* are billed to the Max subscription via forwarded OAuth (verified
  # 2026-07-16 against Anthropic Console → Cost: real ~$0.10/day vs LiteLLM's
  # phantom ~$13 estimate). Their real marginal cost is $0, so mark them
  # zero-cost — otherwise LiteLLM's phantom list-price "spend" inflates BOTH the
  # claude-code key cap AND the anthropic provider budget (which Hermes shares),
  # eventually budget-blocking Hermes + claude-gw for $0 of real spend. Hermes's
  # own Claude fallback rides agent-default→claude-sonnet-4-6, which keeps its
  # real-cost tracking (different alias, uses the API key).
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points:
        - location: message
          role: system
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points:
        - location: message
          role: system
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points:
        - location: message
          role: system
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  timeout: 30
  # Pin prompt-cached Claude calls to the deployment that wrote the cache
  # (harmless at single-replica; correct if a replica is ever added).
  optional_pre_call_checks: ["prompt_caching"]
  provider_budget_config:
    anthropic:
      budget_limit: 20.0      # USD per month
      time_period: 1mo
    deepseek:
      budget_limit: 10.0      # USD per month
      time_period: 1mo

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: true
  health_check_interval: 30
  enable_health_check_routing: true
  # Admit a forwarded LLM-provider auth header (Claude Code's subscription
  # OAuth) to the upstream. Only takes effect for aliases in the
  # model_group_settings forward list below, so Hermes/RAG/dev-pc-tools
  # (other aliases) are unaffected; the proxy's own Authorization (their
  # virtual key) is never forwarded upstream. Campaign #2 Step #2.
  forward_llm_provider_auth_headers: true

# Enable Prometheus metrics at /metrics for the scrape job in
# network/prometheus/prometheus.yml. Without this the endpoint 404s.
litellm_settings:
  callbacks: ["prometheus"]
  # Drop provider-unsupported params instead of erroring. Claude Code sends
  # Anthropic-specific params (e.g. context_management) that the local ollama
  # models (coding/agent-default fallbacks) don't accept — without this, a CC
  # request that routes to a local model 400s. Campaign #2.
  drop_params: true
  # Scope client-header forwarding to ONLY the Claude Code subscription
  # aliases. Claude Code (via claude-gw) sends its Max OAuth in Authorization
  # and its virtual key in x-litellm-api-key; LiteLLM authenticates on the
  # virtual key and forwards the OAuth to Anthropic for these aliases → the
  # Max subscription is billed instead of ANTHROPIC_API_KEY. Campaign #2 Step #2.
  model_group_settings:
    forward_client_headers_to_llm_api:
      - claude-opus-4-8
      - claude-sonnet-5
      - claude-haiku-4-5
